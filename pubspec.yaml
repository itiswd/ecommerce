name: ecommerce_dashboard
description: "Dashboard"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  
  # Localization - مهم للغة العربية و RTL
  flutter_localizations:
    sdk: flutter

  # UI Components & Layout
  cupertino_icons: ^1.0.8
  flutter_admin_scaffold: ^1.4.0

  # Charts & Visualization
  fl_chart: ^1.1.1

  # Data Tables
  data_table_2: ^2.7.2

  # State Management
  provider: ^6.1.5+1

  # Responsive Design
  responsive_framework: ^1.5.1

  # Icons
  font_awesome_flutter: ^10.12.0

  # Firebase
  firebase_core: ^4.3.0
  firebase_auth: ^6.1.3
  cloud_firestore: ^6.1.1

  # Storage
  cloudinary_public: ^0.23.1
  
  # HTTP & API
  dio: ^5.9.0
  
  # Date & Time
  intl: ^0.20.2

  # Local Storage
  shared_preferences: ^2.5.4

  # Image Picker & Handling
  image_picker: ^1.2.1
  cached_network_image: ^3.4.1

  # PDF Generation (للتقارير)
  pdf: ^3.11.3

  # Animations
  animations: ^2.1.1
  

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # Assets
  assets:
    - assets/icons/

  # Fonts - خط Cairo للعربية
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700
        - asset: assets/fonts/Cairo-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Cairo-Light.ttf
          weight: 300